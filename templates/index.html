<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Expense Tracker</h1>

    <form method="POST">
        <input type="text" name="item" placeholder="Item" required>
        <input type="number" name="amount" placeholder="Amount" required>
        <button type="submit">Add Expense</button>
    </form>

    <h2>Expenses:</h2>
    <ul>
        {% for expense in expenses %}
            <li>
                {{ expense.item }} - ${{ expense.amount }}
                <form method="POST" action="/delete/{{ loop.index0 }}" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>

    <h3>Total Spent: ${{ total }}</h3>

    <h2>Spending Chart:</h2>
    <canvas id="expenseChart" width="400" height="200"></canvas>

    {% if expenses %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const expenses = {{ expenses | tojson }};
        const labels = expenses.map(e => e.item);
        const data = expenses.map(e => parseFloat(e.amount));

        const ctx = document.getElementById('expenseChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Amount Spent',
                    data: data,
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    </script>
    {% endif %}
</body>
</html>
